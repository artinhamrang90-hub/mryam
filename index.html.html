<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #292929 0%,
                    #111111 50%,
                    #050505 100%
                );

            padding: 30px;

            overflow: hidden;
        }

        .photo-box {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-box img {
            max-width: 90vw;
            max-height: 90vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(255, 255, 255, 0.08);

            transition: transform 0.3s ease;
        }

        .photo-box img:hover {
            transform: scale(1.02);
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .photo-box img {
                max-width: 94vw;
                max-height: 90vh;

                border-radius: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="photo-box">

        <img src="photo.jpeg" alt="Photo">

    </div>

</body>
</html>
